global:
  scrape_interval: 5s
  evaluation_interval: 5s

# Load alert rules
rule_files:
  - '/etc/prometheus/alerting_rules.yml'

scrape_configs:
  - job_name: 'iot-security-api'
    static_configs:
      - targets: ['iot-threat-api:5000']  # Fixed: using correct container name
    metrics_path: '/metrics'
    scrape_interval: 5s
    
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
